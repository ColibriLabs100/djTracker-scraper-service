name: Trigger Vercel Function

on:
  schedule:
    # Runs every 5 minutes
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel Function
        env:
          AUTOMATION_SECRET: ${{ secrets.AUTOMATION_SECRET }}
        run: |
          curl -X POST "https://dj-tracker-scraper-service.vercel.app/api/cron" -H "Authorization: Bearer $AUTOMATION_SECRET"
